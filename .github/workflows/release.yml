name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/YotoLabels/YotoLabels.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=$version -o publish/YotoLabels
          Compress-Archive -Path publish/YotoLabels -DestinationPath "YotoLabels-$version-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: YotoLabels-*-win-x64.zip
          generate_release_notes: true
