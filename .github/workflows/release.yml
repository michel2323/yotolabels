name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $arch = "${{ matrix.arch }}"
          dotnet publish src/YotoLabels/YotoLabels.csproj -c Release -r win-$arch -p:Platform=${{ matrix.platform }} -p:Version=$version -o publish/YotoLabels
          Compress-Archive -Path publish/YotoLabels -DestinationPath "YotoLabels-$version-win-$arch.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.arch }}
          path: YotoLabels-*.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: YotoLabels-*.zip
          generate_release_notes: true
