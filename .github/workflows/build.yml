name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/YotoLabels/YotoLabels.csproj -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.platform }}
